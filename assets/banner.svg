<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="bannerBg" cx="30%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E0E38" />
      <stop offset="45%" stop-color="#0E051C" />
      <stop offset="100%" stop-color="#04010A" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2B4FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#7B2CBF" />
      <stop offset="80%" stop-color="#FF548F" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
    <filter id="bannerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bannerBg)" />

  <!-- Constellation Network Lines -->
  <g stroke="#7B2CBF" stroke-width="1" stroke-opacity="0.25">
    <line x1="100" y1="120" x2="300" y2="80" />
    <line x1="300" y1="80" x2="520" y2="160" />
    <line x1="950" y1="100" x2="1100" y2="240" />
    <line x1="1100" y1="240" x2="1180" y2="480" />
    <line x1="150" y1="480" x2="340" y2="550" />
    <line x1="800" y1="520" x2="1050" y2="560" />
  </g>

  <!-- Subtle Stars -->
  <circle cx="100" cy="120" r="3" fill="#00F0FF" opacity="0.6" />
  <circle cx="300" cy="80" r="2" fill="#FFFFFF" opacity="0.8" />
  <circle cx="520" cy="160" r="4" fill="#C77DFF" opacity="0.5" />
  <circle cx="950" cy="100" r="3" fill="#00F0FF" opacity="0.6" />
  <circle cx="1100" cy="240" r="2" fill="#FFFFFF" opacity="0.7" />
  <circle cx="1180" cy="480" r="3" fill="#C77DFF" opacity="0.6" />

  <!-- Main Supernova Star (Left Side) -->
  <g transform="translate(260, 320)" filter="url(#bannerGlow)">
    <!-- Orbital Circles -->
    <ellipse cx="0" cy="0" rx="200" ry="65" fill="none" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.3" transform="rotate(-30)" stroke-dasharray="8 6" />
    <ellipse cx="0" cy="0" rx="190" ry="60" fill="none" stroke="#C77DFF" stroke-width="2" stroke-opacity="0.3" transform="rotate(35)" />
    
    <!-- 8-Pointed Star -->
    <polygon points="0,-180 18,-35 180,0 18,35 0,180 -18,35 -180,0 -18,-35" fill="url(#starGrad)" />
    <polygon points="0,-90 15,-20 90,0 15,20 0,90 -15,20 -90,0 -15,-20" fill="#FFFFFF" opacity="0.8" />
    <circle cx="0" cy="0" r="14" fill="#00F0FF" />
  </g>

  <!-- Hero Typography (Right Side) -->
  <g transform="translate(560, 220)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#7B2CBF" fill-opacity="0.4" stroke="#C77DFF" stroke-width="1.5" />
    <text x="110" y="21" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">NEXT-GEN SYSTEMS LANG</text>

    <!-- Main Title -->
    <text x="0" y="110" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" letter-spacing="4">NOVA</text>
    <text x="320" y="110" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" letter-spacing="2">2.0</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="160" fill="#C77DFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="1">Provable Memory Safety • Perceus RC • Zero GC</text>

    <!-- Pillar Badges Grid -->
    <g transform="translate(0, 205)">
      <!-- Pillar 1 -->
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#140728" stroke="#7B2CBF" stroke-width="1.5" />
      <text x="90" y="26" fill="#E2B4FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ Z3 SMT Verification</text>

      <!-- Pillar 2 -->
      <rect x="195" y="0" width="190" height="42" rx="8" fill="#140728" stroke="#00F0FF" stroke-width="1.5" />
      <text x="290" y="26" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🧠 Perceus In-Place Reuse</text>

      <!-- Pillar 3 -->
      <rect x="400" y="0" width="180" height="42" rx="8" fill="#140728" stroke="#FF548F" stroke-width="1.5" />
      <text x="490" y="26" fill="#FF8BB5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🦀 100% Pure Self-Hosted</text>
    </g>
  </g>
</svg>
