name: Nova Release & Multi-Platform Packaging

on:
  push:
    tags:
      - 'v*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make tree libgmp-dev z3
          chmod +x bin/* tests/*.sh benchmarks/*.sh tools/*/* tools/*.sh 2>/dev/null || true

      - name: Set up Environment (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install z3 coreutils
          chmod +x bin/* tests/*.sh benchmarks/*.sh tools/*/* tools/*.sh 2>/dev/null || true

      - name: Set up Environment (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-z3
          path-type: inherit

      - name: Export Windows Toolchain to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "MSYS2 Location: ${{ steps.msys2.outputs.msys2-location }}"
          echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ steps.msys2.outputs.msys2-location }}\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Toolchain in PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "=== Windows PATH Verification ==="
          which gcc || true
          which z3 || true
          gcc --version
          z3 --version
          echo "=== Testing MinGW-w64 GCC linking with runtime/nova_rt.c ==="
          printf '#include "nova_rt.h"\nint main(int argc, char** argv){ nova_set_args(argc, argv); return 0; }\n' > test_link.c
          if ! gcc -O3 -std=c99 -I./runtime test_link.c runtime/nova_rt.c -lpthread -lm -lws2_32 -o test_link.exe 2>&1 | tee link.log; then
            ERR=$(head -n 25 link.log | tr '\r\n' ' ' | sed 's/"//g')
            echo "::error title=GCC Link Error::$ERR"
            exit 1
          fi
          ./test_link.exe
          rm -f test_link.c test_link.exe link.log

      - name: Fetch Legacy Bootstrap Toolchain from nova-legacy-haskell
        run: |
          echo "=== Fetching Genesis bootstrap compiler from nova-legacy-haskell ==="
          git clone --depth=1 https://github.com/novasystems-dev/nova-legacy-haskell.git stage0_repo
          cp -r stage0_repo/stage0 .
          rm -rf stage0_repo

      - name: Set up Haskell Toolchain
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'

      - name: Build Native Stage 0 novac & Orbit on Runner
        run: |
          echo "=== Building Stage 0 novac on Runner ==="
          cd stage0
          cabal update
          cabal build
          RAW_BIN=$(cabal -v0 list-bin novac)
          cd ..

          if command -v cygpath >/dev/null 2>&1; then
            NOVAC_BIN=$(cygpath -u "$RAW_BIN" 2>/dev/null || echo "$RAW_BIN" | tr '\\' '/')
          else
            NOVAC_BIN=$(echo "$RAW_BIN" | tr '\\' '/')
          fi

          echo "cabal list-bin output: '$RAW_BIN' -> normalized: '$NOVAC_BIN'"
          if [ ! -f "$NOVAC_BIN" ]; then
            echo "Searching fallback in stage0/dist-newstyle..."
            FALLBACK_BIN=$(find stage0/dist-newstyle -type f \( -name "novac" -o -name "novac.exe" \) | head -n 1)
            echo "Fallback found: '$FALLBACK_BIN'"
            if [ -n "$FALLBACK_BIN" ] && [ -f "$FALLBACK_BIN" ]; then
              NOVAC_BIN="$FALLBACK_BIN"
            fi
          fi

          echo "Using novac binary: '$NOVAC_BIN'"
          if [ ! -f "$NOVAC_BIN" ]; then
            echo "::error title=Compiler Not Found::Stage 0 novac binary could not be found"
            exit 1
          fi

          # Remove pre-existing repository bin/novac (Linux ELF) so it is not run on Windows/macOS
          rm -f bin/novac bin/novac.exe
          cp -f "$NOVAC_BIN" bin/novac
          cp -f "$NOVAC_BIN" bin/novac.exe 2>/dev/null || true
          chmod +x bin/novac* 2>/dev/null || true
          echo "=== Installed novac binary ==="
          ls -la bin/novac*

          # Clean up temporary stage0 bootstrap so runner workspace remains pure Nova
          rm -rf stage0

          echo "=== Resolving tool script permissions & links ==="
          for tool in bin/nova-fmt bin/nova-lint bin/nova-repl bin/nova-lsp; do
            if [ -f "$tool" ] && [ ! -s "$tool" -o -n "$(head -n 1 "$tool" 2>/dev/null | grep '^\.\.')" ]; then
              target=$(cat "$tool" 2>/dev/null || true)
              if [ -n "$target" ] && [ -f "bin/$target" ]; then
                cp -f "bin/$target" "$tool"
              fi
            fi
            chmod +x "$tool" 2>/dev/null || true
          done

          echo "=== Compiling Native Orbit & Nova-Doc from pure Nova ==="
          NOVAC="./bin/novac"
          if [ -f "bin/novac.exe" ]; then NOVAC="./bin/novac.exe"; fi

          echo "Compiling Orbit..."
          if ! $NOVAC build tools/orbit/main.nova 2>&1 | tee orbit_build.log; then
            ERR_MSG=$(tail -n 25 orbit_build.log | tr '\r\n' ' ' | sed 's/"//g')
            echo "::error title=Orbit Build Failed::$ERR_MSG"
            cat orbit_build.log
            exit 1
          fi
          if [ -f "main.out" ]; then
            cp -f main.out tools/orbit/orbit
            cp -f main.out bin/orbit
          fi
          if [ -f "main.out.exe" ]; then
            cp -f main.out.exe tools/orbit/orbit.exe
            cp -f main.out.exe tools/orbit/orbit 2>/dev/null || true
            cp -f main.out.exe bin/orbit.exe
            cp -f main.out.exe bin/orbit 2>/dev/null || true
          fi
          rm -f main.out main.out.exe

          echo "Compiling DocGen..."
          if ! $NOVAC build tools/docgen/main.nova 2>&1 | tee docgen_build.log; then
            ERR_MSG=$(tail -n 25 docgen_build.log | tr '\r\n' ' ' | sed 's/"//g')
            echo "::error title=DocGen Build Failed::$ERR_MSG"
            cat docgen_build.log
            exit 1
          fi
          if [ -f "main.out" ]; then
            cp -f main.out tools/docgen/nova_doc
            cp -f main.out bin/nova-doc
          fi
          if [ -f "main.out.exe" ]; then
            cp -f main.out.exe tools/docgen/nova_doc.exe
            cp -f main.out.exe tools/docgen/nova_doc 2>/dev/null || true
            cp -f main.out.exe bin/nova-doc.exe
            cp -f main.out.exe bin/nova-doc 2>/dev/null || true
          fi
          rm -f main.out main.out.exe

          chmod +x tools/orbit/orbit* tools/docgen/nova_doc* bin/* 2>/dev/null || true

      - name: Run Verification Test Suite (59 Tests)
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          export NOVAC_BIN="$GITHUB_WORKSPACE/bin/novac"
          chmod +x tests/run_all.sh
          ./tests/run_all.sh 2>&1 | tee test_results.log

      - name: Report Test Results Summary
        if: always()
        run: |
          echo "### Test Execution Results (${{ matrix.target }})" >> $GITHUB_STEP_SUMMARY
          if [ -f orbit_build.log ]; then
            echo "#### Orbit Build Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat orbit_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f docgen_build.log ]; then
            echo "#### DocGen Build Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat docgen_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f test_results.log ]; then
            echo "#### Test Results Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Package Runtime & Full-Dev Distributions
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "master" ]; then
            VERSION="${{ github.event.inputs.tag_name || 'v0.2.5' }}"
          fi
          ./tools/package.sh "$VERSION" "${{ matrix.target }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.target }}
          path: dist/*.*

  create-github-release:
    name: Publish GitHub Release & Update Floating 'latest' Tag
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Packaged Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Downloaded Artifacts & Checksums
        run: |
          echo "=== Release Artifacts ==="
          ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: Nova Systems Language ${{ github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Floating 'latest' Tag
        run: |
          echo "=== Updating floating tag 'latest' to point to current release commit ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Release: Latest Stable Version"
          git push origin latest --force
