name: Nova CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make tree libgmp-dev z3
        chmod +x bin/* tests/*.sh benchmarks/*.sh tools/*/*

    - name: Test C99 Genesis Standalone Bootstrap
      run: |
        echo "=== Compiling novac from Genesis Snapshot C99 (Zero Haskell/Cabal required) ==="
        gcc -O2 -I./runtime bootstrap/novac_bootstrap.c runtime/nova_rt.c -lpthread -o bin/novac-bootstrap-test
        file bin/novac-bootstrap-test
        ./bin/novac-bootstrap-test

    - name: Set up Haskell Toolchain
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.6.6'
        cabal-version: '3.10.3.0'

    - name: Build Native Stage 0 novac & Native Orbit on Runner
      run: |
        echo "=== Building Stage 0 novac natively on Ubuntu Runner ==="
        cd stage0
        cabal update
        cabal build
        cp $(cabal list-bin novac) ../bin/novac
        cd ..
        echo "=== Compiling Native Orbit Package Manager from pure Nova ==="
        ./bin/novac build tools/orbit/main.nova
        mv main.out tools/orbit/orbit
        chmod +x tools/orbit/orbit bin/*

    - name: Run Full Test Suite (44 Industrial Tests)
      run: |
        echo "=== Running Nova Test Suite ==="
        export PATH="$GITHUB_WORKSPACE/bin:$PATH"
        chmod +x tests/run_all.sh
        ./tests/run_all.sh 2>&1 | tee /tmp/test_suite.log
        EXIT_CODE=${PIPESTATUS[0]}
        if [ $EXIT_CODE -ne 0 ]; then
          ERR_MSG=$(tail -n 25 /tmp/test_suite.log | tr '\n' ' ')
          echo "::error title=TestSuiteFailed::$ERR_MSG"
          exit $EXIT_CODE
        fi

    - name: Verify Package Manager & Deterministic Lockfile
      run: |
        echo "=== Testing Orbit Package Management ==="
        export PATH="$GITHUB_WORKSPACE/bin:$PATH"
        orbit new test_project
        cd test_project
        orbit run
        orbit lock
        test -f Orbit.lock
        cat Orbit.lock
