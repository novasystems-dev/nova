name: Nova CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test Linux x86_64
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make tree libgmp-dev z3
        chmod +x bin/* tests/*.sh tests/benchmarks/*.sh tests/tools/*/* tests/tools/*.sh 2>/dev/null || true

    - name: Fetch Legacy Bootstrap Toolchain from nova-legacy-haskell
      run: |
        echo "=== Fetching Genesis bootstrap compiler from nova-legacy-haskell ==="
        git clone --depth=1 https://github.com/novasystems-dev/nova-legacy-haskell.git stage0_repo
        cp -r stage0_repo/stage0 .
        rm -rf stage0_repo

    - name: Set up Haskell Toolchain
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.6.6'
        cabal-version: '3.10.3.0'

    - name: Build Native Genesis novac & Developer Tools
      run: |
        echo "=== Building Genesis novac on Runner ==="
        cd stage0
        cabal update
        cabal build
        RAW_BIN=$(cabal -v0 list-bin novac)
        cd ..
        cp -f "$RAW_BIN" bin/novac
        chmod +x bin/novac
        ./bin/novac version
        echo "=== Compiling Native Orbit & Nova-Doc ==="
        ./bin/novac build tests/tools/orbit/main.nv
        if [ -f main.out ]; then cp -f main.out bin/orbit; cp -f main.out tests/tools/orbit/orbit; rm -f main.out; fi
        ./bin/novac build tests/tools/docgen/main.nv
        if [ -f main.out ]; then cp -f main.out bin/nova-doc; cp -f main.out tests/tools/docgen/nova_doc; rm -f main.out; fi
        chmod +x bin/* tests/tools/*/* 2>/dev/null || true

    - name: Run Full Test Suite (207 Industrial Tests)
      run: |
        echo "=== Running Nova Test Suite ==="
        export PATH="$GITHUB_WORKSPACE/bin:$PATH"
        export NOVAC_BIN="$GITHUB_WORKSPACE/bin/novac"
        chmod +x tests/run_all.sh
        ./tests/run_all.sh 2>&1 | tee /tmp/test_suite.log
        EXIT_CODE=${PIPESTATUS[0]}
        if [ $EXIT_CODE -ne 0 ]; then
          ERR_MSG=$(tail -n 25 /tmp/test_suite.log | tr '\n' ' ')
          echo "::error title=TestSuiteFailed::$ERR_MSG"
          exit $EXIT_CODE
        fi

    - name: Verify Package Manager & Deterministic Lockfile
      run: |
        echo "=== Testing Package Manager Lockfile Integrity ==="
        ./bin/orbit lock
        test -f Orbit.lock
        echo "Lockfile generated and verified successfully."
