name: Nova CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make tree libgmp-dev z3
        chmod +x bin/* tests/*.sh tests/benchmarks/*.sh tests/tools/*/* tests/tools/*.sh 2>/dev/null || true

    - name: Test C99 Genesis Standalone Bootstrap
      run: |
        echo "=== Compiling novac from Genesis Snapshot C99 (Zero Haskell/Cabal required) ==="
        gcc -O3 -std=c99 -I./runtime compiler/bootstrap/novac_bootstrap.c runtime/nova_rt.c -lpthread -lm -o bin/novac-bootstrap-test
        file bin/novac-bootstrap-test
        ./bin/novac-bootstrap-test --version

    - name: Run Full Test Suite (207 Industrial Tests)
      run: |
        echo "=== Running Nova Test Suite ==="
        export PATH="$GITHUB_WORKSPACE/bin:$PATH"
        export NOVAC_BIN="$GITHUB_WORKSPACE/bin/novac"
        chmod +x tests/run_all.sh
        ./tests/run_all.sh 2>&1 | tee /tmp/test_suite.log
        EXIT_CODE=${PIPESTATUS[0]}
        if [ $EXIT_CODE -ne 0 ]; then
          ERR_MSG=$(tail -n 25 /tmp/test_suite.log | tr '\n' ' ')
          echo "::error title=TestSuiteFailed::$ERR_MSG"
          exit $EXIT_CODE
        fi

    - name: Verify Package Manager & Deterministic Lockfile
      run: |
        echo "=== Testing Orbit Package Management ==="
        export PATH="$GITHUB_WORKSPACE/bin:$PATH"
        bin/orbit new test_project
        cd test_project
        ../bin/orbit run
        ../bin/orbit lock
        test -f Orbit.lock
        cat Orbit.lock
        cd ..
        rm -rf test_project
